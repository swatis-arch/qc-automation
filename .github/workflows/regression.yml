name: SUNTEK AI QC — Regression Pipeline

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which test suite to run'
        required: false
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression
          - full
      merchant:
        description: 'Merchant slug (must match merchants/<slug>/config.js and be in ACTIVE_MERCHANTS)'
        required: false
        default: 'revitin'
        type: string
      triggered_by:
        description: 'Who/what triggered this run (for Slack attribution)'
        required: false
        default: ''
        type: string

  # Daily at 2 AM UTC (7:30 AM IST)
  schedule:
    - cron: '0 2 * * *'

# ── Concurrency: cancel in-progress runs on re-trigger ─────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The suite lives in qc-automation-local/, so every `run:` step starts there.
# Artifact `path:` values are not affected by this and include the folder.
defaults:
  run:
    working-directory: qc-automation-local

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── Smoke Tests ─────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Tests — Desktop Chromium
    # Runs nightly alongside regression (the critical path, so a broken checkout shows up in minutes rather than
    # at the end of the long run) and on demand. Add `pull_request:` to `on:` to also run it on PRs.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qc-automation-local/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        # @smoke tests, desktop, every active merchant (or the one given). See utils/tiers.js.
        run: node scripts/run-suite.js smoke
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          ORION_STOREFRONT_PASSWORD: ${{ secrets.ORION_STOREFRONT_PASSWORD }}
          MERCHANT: ${{ github.event.inputs.merchant }}

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-report-${{ github.run_number }}
          path: qc-automation-local/reports/
          retention-days: 7

  # ── Full Regression ──────────────────────────────────────────────────────────
  regression:
    name: Full Regression — Desktop (mobile suites run at 390x844 inside it)
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'regression' || github.event.inputs.suite == 'full'))
    runs-on: ubuntu-latest
    # KOH alone took ~37 min on 2026-10-15; three merchants need well over an hour.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qc-automation-local/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Tier comes from the suite input: 'full' for major releases, otherwise the
      # daily 'regression' tier (schedule has no input). See utils/tiers.js.
      - name: Run ${{ github.event.inputs.suite == 'full' && 'full' || 'regression' }} tier
        run: node scripts/run-suite.js ${{ github.event.inputs.suite == 'full' && 'full' || 'regression' }}
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          ORION_STOREFRONT_PASSWORD: ${{ secrets.ORION_STOREFRONT_PASSWORD }}
          # Empty MERCHANT runs every slug in ACTIVE_MERCHANTS (merchants/index.js).
          # On the nightly schedule there is no `inputs.merchant`, so this must NOT
          # fall back to a single slug or the other merchants would silently never run.
          MERCHANT: ${{ github.event.inputs.merchant }}
        continue-on-error: true    # Continue to AI analysis even if tests fail

      - name: Run Claude AI failure analysis
        run: node ai/analyze-failure.js
        env:
          CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL:       claude-sonnet-5-5
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MERCHANT:       ${{ github.event.inputs.merchant }}
        continue-on-error: true    # Non-fatal if Claude is unavailable

      - name: Generate consolidated QA report
        run: node ai/generate-report.js
        env:
          MERCHANT:     ${{ github.event.inputs.merchant }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by || github.event_name }}
        continue-on-error: true

      - name: Send Slack notification
        run: node notifications/slack.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MERCHANT:          ${{ github.event.inputs.merchant }}
          TRIGGERED_BY:      ${{ github.event.inputs.triggered_by || github.event_name }}
        continue-on-error: true    # Non-fatal if Slack is not configured

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: qc-automation-local/reports/html/
          retention-days: 30

      - name: Upload QA evidence and RCA
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: qa-evidence-${{ github.run_number }}
          path: |
            qc-automation-local/reports/results.json
            qc-automation-local/reports/evidence/
            qc-automation-local/reports/rca/
            qc-automation-local/reports/qa-report.json
            qc-automation-local/reports/qa-report.md
          retention-days: 30

  # Visual and technical jobs were removed on 2026-10-14 with their specs (now in
  # qc-automation-local/tests/_archive/). Only agent-generated tests run.
