name = "suntek-qc-slack-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret config. Secrets (SLACK_SIGNING_SECRET, GITHUB_TOKEN) are set via
# `wrangler secret put` — see README.md — and must NOT be added here.
[vars]
GITHUB_OWNER = "REPLACE_WITH_GITHUB_ORG_OR_USERNAME"
GITHUB_REPO = "REPLACE_WITH_REPO_NAME"
GITHUB_REF = "main"
