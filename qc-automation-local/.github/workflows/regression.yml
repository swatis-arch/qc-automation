name: SUNTEK AI QC — Regression Pipeline

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which test suite to run'
        required: false
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression
          - full
          - visual
          - technical
      merchant:
        description: 'Merchant slug (must match merchants/<slug>/config.js and be in ACTIVE_MERCHANTS)'
        required: false
        default: 'revitin'
        type: string
      triggered_by:
        description: 'Who/what triggered this run (for Slack attribution)'
        required: false
        default: ''
        type: string

  # Daily at 2 AM UTC (7:30 AM IST)
  schedule:
    - cron: '0 2 * * *'

# ── Concurrency: cancel in-progress runs on re-trigger ─────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── Smoke Tests ─────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Tests — Desktop Chromium
    # NOTE: there is no `pull_request:` trigger in the `on:` block above, so
    # a `pull_request` branch here would be dead code. Add `pull_request:`
    # to `on:` first if you want smoke tests to run automatically on PRs.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project="${MERCHANT}-desktop-chromium"
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          MERCHANT: ${{ github.event.inputs.merchant || 'revitin' }}

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-report-${{ github.run_number }}
          path: reports/
          retention-days: 7

  # ── Full Regression ──────────────────────────────────────────────────────────
  regression:
    name: Full Regression — Desktop + Mobile
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'regression' || github.event.inputs.suite == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Tier comes from the suite input: 'full' for major releases, otherwise the
      # daily 'regression' tier (schedule has no input). See utils/tiers.js.
      - name: Run ${{ github.event.inputs.suite == 'full' && 'full' || 'regression' }} tier (desktop + mobile)
        run: node scripts/run-suite.js ${{ github.event.inputs.suite == 'full' && 'full' || 'regression' }} all
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          # Empty MERCHANT runs every slug in ACTIVE_MERCHANTS (merchants/index.js).
          # On the nightly schedule there is no `inputs.merchant`, so this must NOT
          # fall back to a single slug or the other merchants would silently never run.
          MERCHANT: ${{ github.event.inputs.merchant }}
        continue-on-error: true    # Continue to AI analysis even if tests fail

      - name: Run Claude AI failure analysis
        run: node ai/analyze-failure.js
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL:   claude-sonnet-5
          MERCHANT:       ${{ github.event.inputs.merchant }}
        continue-on-error: true    # Non-fatal if Claude is unavailable

      - name: Generate consolidated QA report
        run: node ai/generate-report.js
        env:
          MERCHANT:     ${{ github.event.inputs.merchant }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by || github.event_name }}
        continue-on-error: true

      - name: Send Slack notification
        run: node notifications/slack.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MERCHANT:          ${{ github.event.inputs.merchant }}
          TRIGGERED_BY:      ${{ github.event.inputs.triggered_by || github.event_name }}
        continue-on-error: true    # Non-fatal if Slack is not configured

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: reports/html/
          retention-days: 30

      - name: Upload QA evidence and RCA
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: qa-evidence-${{ github.run_number }}
          path: |
            reports/results.json
            reports/evidence/
            reports/rca/
            reports/qa-report.json
            reports/qa-report.md
          retention-days: 30

  # ── Visual Regression ────────────────────────────────────────────────────────
  visual:
    name: Visual Regression
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'visual'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        run: npx playwright test tests/visual.spec.js --project="${MERCHANT}-desktop-chromium"
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          MERCHANT: ${{ github.event.inputs.merchant || 'revitin' }}

      - name: Upload visual report + screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report-${{ github.run_number }}
          path: |
            reports/html/
            test-results/
          retention-days: 30

  # ── Technical Quality ────────────────────────────────────────────────────────
  technical:
    name: Technical Quality Checks
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'technical'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run technical quality checks
        run: npx playwright test tests/technical.spec.js --project="${MERCHANT}-desktop-chromium"
        env:
          CI:       true
          BASE_URL: ${{ secrets.BASE_URL }}
          MERCHANT: ${{ github.event.inputs.merchant || 'revitin' }}

      - name: Upload technical report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: technical-report-${{ github.run_number }}
          path: reports/html/
          retention-days: 14
